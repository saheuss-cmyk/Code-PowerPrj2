<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Teachable Machine Sketch</title>

        <link rel="stylesheet" href="stylepage.css">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.10/p5.min.js"></script>
        <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js" type="text/javascript"></script>
    </head>

    <body>
        <div class="model">
            <div id="canvas-container"></div>
            <div class="predictions"></div>
        </div>
        <script type="text/javascript">
            // Teachable Machine
            // The Coding Train / Daniel Shiffman
            // https://thecodingtrain.com/TeachableMachine/1-teachable-machine.html
            // https://editor.p5js.org/codingtrain/sketches/PoZXqbu4v

            // The video
            let video;
            // For displaying the label
            let label = "Loading...";
            // The classifier
            let classifier;
            let modelURL = 'https://teachablemachine.withgoogle.com/models/N6-1Y1S_4/';

            // STEP 1: Load the model!
            function preload() {
                classifier = ml5.imageClassifier(modelURL + 'model.json');
            }

            function setup() {
                const canvas = createCanvas(640, 520);
                canvas.parent("canvas-container");
                // Create the video
                video = createCapture(VIDEO);
                video.hide();
                // STEP 2: Start classifying
                classifyVideo();
            }

            // STEP 2 classify the videeo!
            function classifyVideo() {
                classifier.classify(video, gotResults);
            }

            function draw() {
                background(0);

                // Draw the video
                image(video, 0, 0);

                // STEP 4: Draw the label
                textSize(32);
                textAlign(CENTER, CENTER);
                fill(255);
                text(label, width / 2, height - 16);

                // Pick an emoji
                let emoji = "";
                if (label == "Loading...") {
                    emoji = "⏳"
                } else if (label == "Spray Bottle") {
                    emoji = "🧴";
                } else if (label == "Dish Soap") {
                    emoji = "🧼";
                } else if (label == "Sponge") {
                    emoji = "🧽";
                }

                // Draw the emoji
                textSize(128);
                text(emoji, width / 2, height / 2);
            }

            // STEP 3: Get the classification!
            function gotResults(error, results) {
                // Something went wrong!
                if (error) {
                    console.error(error);
                    return;
                }
                // Store the label
                label = results[0].label;

                // get prediction percentage for each classification
                const predictions = document.querySelector(".predictions")
                predictions.innerHTML = ""
                for (let i = 0; i < results.length; i++) {
                    const prediction = document.createElement("div");
                    prediction.textContent = `${results[i].label}: ${(results[i].confidence*100).toFixed(2)}%`;
                    predictions.appendChild(prediction);
                }

                // classify again
                classifyVideo();
            }

        </script>
    </body>
</html>
